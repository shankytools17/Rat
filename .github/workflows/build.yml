name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/build.yml'
      - '**/*.kv'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          test -s main.py || { echo 'Missing or empty main.py'; exit 1; }
          test -s buildozer.spec || { echo 'Missing buildozer.spec'; exit 1; }

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-dev build-essential autoconf automake libtool libtool-bin pkg-config cmake ninja-build libffi-dev libssl-dev zlib1g-dev libsqlite3-dev liblzma-dev libncurses-dev

      - name: Install Buildozer
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 -m pip install --user --break-system-packages --upgrade buildozer 'cython==0.29.34' 'setuptools<81' wheel

      - name: Patch python-for-android libffi autoreconf compatibility
        shell: bash
        run: |
          set -euo pipefail
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          mkdir -p "$(dirname "$P4A_DIR")"
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git "$P4A_DIR"
          export P4A_DIR
          python3 - <<'PY'
          import os
          from pathlib import Path
          recipe = Path(os.environ['P4A_DIR']) / 'pythonforandroid/recipes/libffi/__init__.py'
          content = recipe.read_text()
          needle = "shprint(sh.Command('./autogen.sh'), _env=env)"
          if content.count(needle) != 1:
              raise SystemExit('libffi recipe changed; refusing unsafe patch')
          patch = '''# Work around undefined LT_SYS_SYMBOL_USCORE on modern libtool/autoconf.
                  from pathlib import Path
                  config = Path('configure.ac')
                  if config.exists():
                      data = config.read_text()
                      if 'LT_SYS_SYMBOL_USCORE' in data:
                          config.write_text(data.replace('LT_SYS_SYMBOL_USCORE', 'm4_ifdef([LT_SYS_SYMBOL_USCORE], [LT_SYS_SYMBOL_USCORE])'))
                  '''
          content = content.replace(needle, patch + needle)
          recipe.write_text(content)
          print('Patched libffi recipe:', recipe)
          PY

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          PIP_BREAK_SYSTEM_PACKAGES: '1'
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -o pipefail
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log
          if-no-files-found: ignore
