name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f main.py
          test -f buildozer.spec

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-dev build-essential autoconf automake libtool libtool-bin pkg-config cmake ninja-build libffi-dev libssl-dev zlib1g-dev libsqlite3-dev liblzma-dev libncurses-dev

      - name: Install Buildozer
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 -m pip install --user --break-system-packages --upgrade buildozer 'cython==0.29.34' 'setuptools<81' wheel

      - name: Patch libffi recipe and validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          P4A_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          mkdir -p "$(dirname "$P4A_DIR")"
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git "$P4A_DIR"
          export P4A_DIR
          python3 - <<'PY'
          import ast
          import os
          from pathlib import Path
          recipe = Path(os.environ['P4A_DIR']) / 'pythonforandroid/recipes/libffi/__init__.py'
          original = recipe.read_text()
          lines = original.splitlines(keepends=True)
          target = "shprint(sh.Command('./autogen.sh'), _env=env)"
          matches = [i for i, line in enumerate(lines) if target in line]
          if len(matches) != 1:
              raise SystemExit('libffi recipe changed: refusing unsafe patch')
          idx = matches[0]
          indent = lines[idx][:len(lines[idx]) - len(lines[idx].lstrip())]
          patch = [
              '# Work around missing LT_SYS_SYMBOL_USCORE macro in libffi configure.ac',
              'from pathlib import Path',
              "config = Path('configure.ac')",
              'if config.is_file():',
              '    data = config.read_text()',
              "    if 'LT_SYS_SYMBOL_USCORE' in data:",
              "        config.write_text(data.replace('LT_SYS_SYMBOL_USCORE', 'm4_ifdef([LT_SYS_SYMBOL_USCORE], [LT_SYS_SYMBOL_USCORE])'))",
          ]
          # Insert at exactly the same indentation level as autogen.sh.
          lines[idx:idx] = [indent + statement + '\n' for statement in patch]
          modified = ''.join(lines)
          ast.parse(modified, filename=str(recipe))
          compile(modified, str(recipe), 'exec')
          recipe.write_text(modified)
          print('libffi recipe patched; Python syntax validated')
          PY

      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-output.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          if-no-files-found: ignore
